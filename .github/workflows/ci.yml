# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ClickHouse ${{ matrix.engine.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        engine:
          - release: "25.3"
            image: clickhouse/clickhouse-server@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2
          - release: "25.8"
            image: clickhouse/clickhouse-server@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    services:
      clickhouse:
        image: ${{ matrix.engine.image }}
        env:
          CLICKHOUSE_USER: meridian
          CLICKHOUSE_PASSWORD: meridian-test
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports: ["28123:8123"]
        options: >-
          --health-cmd "clickhouse-client --user meridian --password meridian-test --query 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CLICKHOUSE_SELECTED_RELEASE: ${{ matrix.engine.release }}
      CLICKHOUSE_IMAGE: ${{ matrix.engine.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install exact development dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip==26.2'
          python -m pip install --require-hashes -r requirements-validation.txt
          mkdir -p build/evidence
          python -m pip install --disable-pip-version-check '.[test]' --report build/evidence/install.json
          python -m pip check
      - name: Verify source
        run: |
          ruff format --check .
          ruff check .
          mypy src
      - name: Verify released contracts
        run: python scripts/verify_contracts.py
      - name: Run conformance tests
        run: pytest --junitxml=build/evidence/tests.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: conformance-${{ matrix.python }}-${{ matrix.engine.release }}
          path: build/evidence/
          if-no-files-found: error

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip==26.2'
          python -m pip install --require-hashes -r requirements-validation.txt
          mkdir -p build/evidence
          python -m pip install --disable-pip-version-check '.[test]' --report build/evidence/install.json
          python -m pip check
      - run: bandit -r src -c pyproject.toml
      - run: pip-audit

  package:
    name: Package
    needs: [test, security]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --disable-pip-version-check --upgrade 'pip==26.2'
          python -m pip install --require-hashes -r requirements-validation.txt
          mkdir -p build/evidence
          python -m pip install --disable-pip-version-check '.[test]' --report build/evidence/install.json
          python -m pip check
      - name: Build twice
        run: |
          python -m build --no-isolation --outdir dist-a
          python -m build --no-isolation --outdir dist-b
      - name: Verify distributions
        run: |
          twine check dist-a/*
          python scripts/verify_artifacts.py dist-a
          python scripts/compare_artifacts.py dist-a dist-b
          cd dist-a && sha256sum meridian_plugin_observability-* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meridian-plugin-observability-1.0.3
          path: dist-a/
          if-no-files-found: error
          retention-days: 30
