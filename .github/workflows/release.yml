# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787702400"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --disable-pip-version-check -e '.[test]'
      - run: |
          ruff format --check .
          ruff check .
          mypy src
          python scripts/verify_contracts.py
          pytest
      - run: |
          python -m build --no-isolation --outdir dist
          twine check dist/*
          python scripts/verify_artifacts.py dist
          cd dist && sha256sum meridian_plugin_observability-* > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  attest:
    name: Attest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/meridian_plugin_observability-*"

  github-release:
    name: Publish GitHub release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  pypi:
    name: Publish PyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/meridian-plugin-observability
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Select distributions
        run: |
          mkdir -p publish
          cp dist/*.whl dist/*.tar.gz publish/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: publish/
